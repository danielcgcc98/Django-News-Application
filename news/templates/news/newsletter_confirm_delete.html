{% extends "news/base.html" %}
{% block title %}Delete Newsletter{% endblock %}
{% block content %}
<h1>Delete Newsletter</h1><p>Are you sure you want to delete <strong>{{ newsletter.title }}</strong>?</p>
<form method="post">{% csrf_token %}<button class="button danger" type="submit">Yes, Delete Newsletter</button> <a class="button secondary" href="{% url 'newsletter_detail' newsletter.id %}">Cancel</a></form>
{% endblock %}
