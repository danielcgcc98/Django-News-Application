{% extends "news/base.html" %}
{% block title %}Delete Article{% endblock %}
{% block content %}
<h1>Delete Article</h1><p>Are you sure you want to delete <strong>{{ article.title }}</strong>?</p>
<form method="post">{% csrf_token %}<button class="button danger" type="submit">Yes, Delete Article</button> <a class="button secondary" href="{% url 'article_list' %}">Cancel</a></form>
{% endblock %}
