<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Article</title>
</head>

<body>

    <h1>Delete Article</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>{{ article.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete Article
        </button>

    </form>

    <p>
        <a href="{% url 'article_list' %}">
            Cancel
        </a>
    </p>

</body>
</html>
