<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Django News</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { width: 420px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        h1 { text-align: center; margin-bottom: 25px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #333; color: white; border: 0; border-radius: 4px; cursor: pointer; }
        .helptext { font-size: 13px; color: #666; }
        .errors { color: #b00020; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        {% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p style="text-align:center; margin-top:20px;">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</body>
</html>
